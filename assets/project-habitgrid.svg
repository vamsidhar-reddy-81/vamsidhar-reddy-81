<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-label="HabitGrid: A mobile-first habit tracker with streaks, calendar history and Excel export. Built: check-ins · streaks · progress ring · SheetJS export. Stack: HTML, CSS, JavaScript, SheetJS, localStorage.">
<defs>
<linearGradient id="p01bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#070A14"/></linearGradient>
<radialGradient id="p01gl" cx="85%" cy="25%" r="60%"><stop offset="0" stop-color="#818CF8" stop-opacity=".35"/><stop offset="1" stop-color="#818CF8" stop-opacity="0"/></radialGradient>
<pattern id="p01gr" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#5EEAD4" stroke-opacity=".06"/></pattern>
<clipPath id="p01cl"><rect width="1200" height="370" rx="18"/></clipPath>
</defs>
<style>.s{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.n{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.a{animation:up 1s ease both}.d2{animation-delay:.25s}.d3{animation-delay:.5s}
@media(prefers-reduced-motion:reduce){.a{animation:none}}</style>
<g clip-path="url(#p01cl)"><rect width="1200" height="370" fill="url(#p01bg)"/><rect width="1200" height="370" fill="url(#p01gl)"/><rect width="1200" height="370" fill="url(#p01gr)"/>
<text x="40" y="52" class="m" font-size="11.5" fill="#5EEAD4" letter-spacing="2">01 · WEB APP · PWA · 2026</text><text x="40" y="112" class="s" font-size="52" fill="#EEF2FF" >HabitGrid</text><text x="40" y="150" class="n" font-size="18" fill="#CBD5E1" >A mobile-first habit tracker with streaks, calendar history and Excel export.</text><text x="40" y="186" class="m" font-size="11.5" fill="#5EEAD4" >BUILT ›</text><text x="100" y="186" class="m" font-size="11.5" fill="#C7D2FE" >check-ins · streaks · progress ring · SheetJS export</text><line x1="40" y1="206" x2="720" y2="206" stroke="#3B4A7A"/><text x="40" y="252" class="s" font-size="32" fill="#EEF2FF" >Streaks</text><text x="40" y="276" class="n" font-size="12.5" fill="#94A3B8" >daily check-ins</text><text x="270" y="252" class="s" font-size="32" fill="#EEF2FF" >14 / 30</text><text x="270" y="276" class="n" font-size="12.5" fill="#94A3B8" >day trend &amp; completion</text><text x="500" y="252" class="s" font-size="32" fill="#EEF2FF" >Excel</text><text x="500" y="276" class="n" font-size="12.5" fill="#94A3B8" >full log, summary, daily</text><rect x="40" y="304" width="55.6" height="26" rx="13" fill="#818CF8" fill-opacity=".12" stroke="#818CF8" stroke-opacity=".5"/><text x="53" y="321.5" class="m" font-size="11.5" fill="#C7D2FE" >HTML</text><rect x="103.6" y="304" width="48.2" height="26" rx="13" fill="#818CF8" fill-opacity=".12" stroke="#818CF8" stroke-opacity=".5"/><text x="116.6" y="321.5" class="m" font-size="11.5" fill="#C7D2FE" >CSS</text><rect x="159.8" y="304" width="100.0" height="26" rx="13" fill="#818CF8" fill-opacity=".12" stroke="#818CF8" stroke-opacity=".5"/><text x="172.8" y="321.5" class="m" font-size="11.5" fill="#C7D2FE" >JavaScript</text><rect x="267.8" y="304" width="77.80000000000001" height="26" rx="13" fill="#818CF8" fill-opacity=".12" stroke="#818CF8" stroke-opacity=".5"/><text x="280.8" y="321.5" class="m" font-size="11.5" fill="#C7D2FE" >SheetJS</text><rect x="353.6" y="304" width="114.80000000000001" height="26" rx="13" fill="#818CF8" fill-opacity=".12" stroke="#818CF8" stroke-opacity=".5"/><text x="366.6" y="321.5" class="m" font-size="11.5" fill="#C7D2FE" >localStorage</text><rect x="820" y="60" width="150" height="52" rx="10" fill="#818CF8" fill-opacity="0.25" stroke="#5EEAD4"/><text x="895.0" y="90.0" class="m" font-size="11.5" fill="#EEF2FF" text-anchor="middle">Add habit</text><rect x="990" y="60" width="150" height="52" rx="10" fill="#818CF8" fill-opacity="0.08" stroke="#3B4A7A"/><text x="1065.0" y="90.0" class="m" font-size="11.5" fill="#EEF2FF" text-anchor="middle">Daily check-in</text><rect x="820" y="130" width="150" height="52" rx="10" fill="#818CF8" fill-opacity="0.08" stroke="#3B4A7A"/><text x="895.0" y="160.0" class="m" font-size="11.5" fill="#EEF2FF" text-anchor="middle">Streak + ring</text><rect x="990" y="130" width="150" height="52" rx="10" fill="#818CF8" fill-opacity="0.08" stroke="#3B4A7A"/><text x="1065.0" y="160.0" class="m" font-size="11.5" fill="#EEF2FF" text-anchor="middle">Excel export</text><text x="820" y="230" class="m" font-size="11" fill="#94A3B8" >localStorage · no backend · offline-friendly</text></g>
<rect x=".5" y=".5" width="1199" height="369" rx="18" fill="none" stroke="#3B4A7A" stroke-opacity=".7"/></svg>