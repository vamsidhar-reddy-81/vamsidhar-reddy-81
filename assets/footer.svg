<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="1200" height="270" role="img" aria-label="Vamsidhaar — Learning in public. Building until it ships.">
<defs>
<linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#070A14"/></linearGradient>
<radialGradient id="fgl" cx="85%" cy="25%" r="60%"><stop offset="0" stop-color="#818CF8" stop-opacity=".35"/><stop offset="1" stop-color="#818CF8" stop-opacity="0"/></radialGradient>
<pattern id="fgr" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#5EEAD4" stroke-opacity=".06"/></pattern>
<clipPath id="fcl"><rect width="1200" height="270" rx="18"/></clipPath>
</defs>
<style>.s{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.n{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.a{animation:up 1s ease both}.d2{animation-delay:.25s}.d3{animation-delay:.5s}
@media(prefers-reduced-motion:reduce){.a{animation:none}}</style>
<g clip-path="url(#fcl)"><rect width="1200" height="270" fill="url(#fbg)"/><rect width="1200" height="270" fill="url(#fgl)"/><rect width="1200" height="270" fill="url(#fgr)"/>
<text x="600" y="125" class="s" font-size="84" fill="#5EEAD4" text-anchor="middle" font-style="italic">Vamsidhaar</text><line x1="300" y1="160" x2="900" y2="160" stroke="#3B4A7A"/><circle cx="600" cy="160" r="4" fill="#5EEAD4"/><text x="600" y="200" class="s" font-size="21" fill="#CBD5E1" text-anchor="middle" font-style="italic">Learning in public. Building until it ships.</text><text x="600" y="235" class="m" font-size="11" fill="#94A3B8" text-anchor="middle" letter-spacing="4">AI · MACHINE LEARNING  ·  WEB  ·  PYTHON</text></g>
<rect x=".5" y=".5" width="1199" height="269" rx="18" fill="none" stroke="#3B4A7A" stroke-opacity=".7"/></svg>