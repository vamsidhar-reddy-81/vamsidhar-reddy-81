name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:          # manual "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate light-blue snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=#7dd3fc&color_dots=#111827,#0c4a6e,#0284c7,#38bdf8,#bae6fd&sizeDotBorderRadius=4
            dist/github-contribution-grid-snake.svg?color_snake=#0ea5e9&color_dots=#ebedf0,#bae6fd,#7dd3fc,#38bdf8,#0284c7&sizeDotBorderRadius=4

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
